# claude-box sandbox policy for this project.
# Deps: bubblewrap, socat, tinyproxy
#
# Created with defaults on first run. It belongs to the project, so commit it —
# the box is only as tight as this file says.


# Launch command (claude, pi.dev, ...). Resolved on the host via PATH; split on
# whitespace, so no quoted arguments. Command-line arguments are appended.
exec claude --dangerously-skip-permissions --thinking-display summarized


# Directory access. $PWD, /usr /bin /sbin /lib /lib64 /etc and the agent's own
# install are mounted whatever this says; everything else is listed here or is
# not in the box at all. Missing paths are skipped and reported at launch.
#
# rw/ro/hide nest, and the narrowest line wins regardless of the order they are
# written in — which is what the ~/.claude block below relies on.
rw ~/.claude              # sessions, history, projects, tasks, settings
rw ~/.claude.json         # top-level config
rw ~/.cache/claude        # cache
rw ~/.local/state/claude  # state
rw ~/.npm                 # npx/MCP installs (drop if unused)

ro ~/.gitconfig           # so commits keep your user.name / user.email
ro ~/.config/git

# ~/.claude is writable above because the agent keeps its live state there, but
# not all of it is state. Two things in it are worth narrowing:
#
# Startup code. Hooks and settings are read every time the agent starts,
# INCLUDING launches outside this box, so a session that can write them can
# leave something behind that later runs unjailed with your full user rights.
# The box confines the session it runs; it cannot confine what that session
# leaves for next time. Read-only closes that. The cost is that /config,
# /hooks and plugin installs stop working inside the box — do those outside it.
ro ~/.claude/settings.json
ro ~/.claude/plugins/marketplaces   # plugin CODE; the json beside it stays rw

# Other projects' transcripts. These are project data, and they sit outside the
# mount policy's reach: hiding ~/Documents does nothing if the agent wrote about
# it in a session last week. Hide the lot, then name this project's own back in.
# The directory is the project path with the separators turned into dashes; if
# the name is wrong the banner says so, because a skipped rw under a hide is
# reported as an error rather than quietly giving you an empty tmpfs.
hide ~/.claude/projects
rw ~/.claude/projects/-home-bz-code-firewall

# Same leak in a second place, keyed by session id instead of project, so it
# cannot be narrowed the same way — hiding it keeps checkpoints working within
# a session and drops rollback across them. Comment it out to trade back.
hide ~/.claude/file-history

# Nim, read-only on purpose: ~/.nimble is on PATH, so a writable mount would
# let a boxed session alter the toolchain and installed packages. The cost is
# that `nimble install` fails inside the box. ~/.choosenim must come along —
# the binaries in ~/.nimble/bin are proxies that read ~/.choosenim/current to
# find the real compiler. nimcache stays writable so compiles work.
ro ~/.choosenim
ro ~/.nimble
rw ~/.cache/nim


# Network access
proxy 127.0.0.1:8443              # https proxy; drop the line for no egress
#net 127.0.0.1:5432 127.0.0.1:5432 # raw TCP bridge, NOT allowlisted
#ssh ~/.config/claude-box/git-key  # private single-key agent for git over ssh
#share-net                         # instead of all three: open host network

# DNS allow list. A bare domain allows it and everything under it, anchored for
# you: anthropic.com becomes ^(.+\.)?anthropic\.com$. For anything narrower,
# write the regex yourself — a line with a regex metacharacter in it is passed
# to tinyproxy verbatim, e.g. ^files\.pythonhosted\.org$ for that host alone.

# The agent itself. All three domains are needed: api.anthropic.com (API,
# statsig), claude.ai, and claude.com — /login's OAuth token exchange goes to
# platform.claude.com, so without claude.com the pasted response code is
# rejected even though normal API traffic works.
anthropic.com
claude.ai
claude.com


# git / gh over https
github.com
githubusercontent.com


# package registries
npmjs.org
pypi.org
files.pythonhosted.org

# Go toolchain and modules. Both come from proxy.golang.org (module zips and
# the toolchain itself, since go.mod pins a version newer than the host's), and
# the checksum database is sum.golang.org — the anchored pattern covers all of
# them. Without this line `go build` in ui/ fails at the toolchain download and
# nothing in the project can be compiled, vetted, or tested inside the box.
golang.org
storage.googleapis.com


# --- common additions, uncomment as needed ---
#crates.io
#docker.io
#ubuntu.com
