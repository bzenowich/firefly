# Generated by fwd — do not edit; changes are overwritten on apply.
server:
    verbosity: 1
    do-ip6: no
    interface: 127.0.0.1
    interface: 192.168.1.1
    interface: 10.0.2.1
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.1.0/24 allow
    access-control: 10.0.2.0/24 allow

    hide-identity: yes
    hide-version: yes
    tls-cert-bundle: /usr/local/share/certs/ca-root-nss.crt
    harden-glue: yes
    harden-dnssec-stripped: yes
    prefetch: yes
    # Never forward queries for private space upstream
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16

    local-zone: "lan." transparent
    local-data: "firewall.lan. IN A 192.168.1.1"
    local-data: "nas.lan. IN A 192.168.1.5"
    local-data-ptr: "192.168.1.5 nas.lan."

    # Compiled adblock blocklists (see AdblockInclude)
    include: /var/db/fwd/adblock.conf

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
