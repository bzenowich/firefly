# Generated by fwd — do not edit; changes are overwritten on apply.
# Source of truth: the appliance config (plan.md §7).

wan_if = "igc0"
lan_if = "igc1"
opt1_if = "igc2"

set skip on lo0
set block-policy drop
set loginterface $wan_if

scrub in all fragment reassemble

# Outbound NAT
nat on $wan_if inet from $lan_if:network to any -> ($wan_if)
nat on $wan_if inet from $opt1_if:network to any -> ($wan_if)

# Port forwards (rdr)
rdr on $wan_if inet proto tcp from any to ($wan_if) port 443 -> 192.168.1.10 port 443 # web
rdr on $wan_if inet proto { tcp udp } from any to ($wan_if) port 27015 -> 192.168.1.20 port 27015 # game

# Filter: default deny in, allow out from the firewall itself
block in log all
pass out quick inet keep state (pflow)
antispoof quick for $wan_if

# LAN and OPT networks are trusted
pass in on $lan_if inet all keep state (pflow)
pass in on $opt1_if inet all keep state (pflow)

# Port forwards (pass redirected traffic)
pass in on $wan_if inet proto tcp from any to 192.168.1.10 port 443 keep state (pflow) # web
pass in on $wan_if inet proto { tcp udp } from any to 192.168.1.20 port 27015 keep state (pflow) # game

# WireGuard
pass in on $wan_if inet proto udp from any to ($wan_if) port 51820 keep state (pflow)
pass in on $wan_if inet proto udp from any to ($wan_if) port 51821 keep state (pflow)

