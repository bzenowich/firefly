# Generated by fwd — do not edit; changes are overwritten on apply.
# Source of truth: the appliance config (plan.md §7).

wan_if = "igc0"
lan_if = "igc1"
opt1_if = "igc2"

set skip on lo0
set block-policy drop
set loginterface $wan_if

scrub in all fragment reassemble

# Outbound NAT
nat on $wan_if inet from $lan_if:network to any -> ($wan_if)

# Port forwards (rdr)

# Filter: default deny in, allow out from the firewall itself
block in log all
pass out quick keep state (pflow)
# ICMPv6 that IPv6 cannot function without: neighbour discovery, router
# advertisement, and path-MTU discovery. Blocking these breaks v6 rather
# than hardening it.
pass quick inet6 proto icmp6 icmp6-type { neighbrsol neighbradv routersol routeradv } keep state (pflow)
pass quick inet6 proto icmp6 icmp6-type { unreach toobig timex paramprob } keep state (pflow)

antispoof quick for $wan_if

# Admin plane: the WebUI and sshd.
# No explicit sources configured, so the whole LAN may manage the box.
pass in quick on $lan_if proto tcp from $lan_if:network to (self) port { 8443 22 } keep state (pflow)
block in log quick proto tcp to (self) port { 8443 22 }

# LAN (trusted): full access.
pass in on $lan_if all keep state (pflow)

