{{define "content"}}
<h1>Traffic</h1>
<p class="muted">Per-interface throughput, sampled every few seconds into a SQLite ring buffer.</p>

<div class="traffic-ranges">
  <button type="button" data-range="hour" class="secondary active">Hour</button>
  <button type="button" data-range="day" class="secondary">Day</button>
  <button type="button" data-range="week" class="secondary">Week</button>
  <button type="button" data-range="month" class="secondary">Month</button>
</div>

<div id="charts"></div>
<p class="muted" id="traffic-status">loading…</p>

<script src="/static/traffic.js"></script>
{{end}}
